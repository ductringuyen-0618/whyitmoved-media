name: render
# A production run pushes a spec to specs/<YYYY-MM-DD>/<name>.json.
# This workflow renders it with tools/stockshort.py and commits <YYYY-MM-DD>/<name>.mp4,
# which Metricool then fetches from raw.githubusercontent.com.
on:
  push:
    branches: [main]
    paths: ['specs/**.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install kokoro-onnx soundfile numpy pillow
          mkdir -p ~/.fonts && cp tools/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stockshort
          key: kokoro-v1
      - name: Render missing videos
        run: |
          set -e
          for spec in $(find specs -name '*.json' | sort); do
            dir=$(basename "$(dirname "$spec")"); name=$(basename "$spec" .json)
            target="$dir/$name.mp4"
            if [ -f "$target" ]; then continue; fi
            echo "Rendering $spec"
            rm -rf out && mkdir out
            python3 tools/stockshort.py "$spec" --out out
            mkdir -p "$dir"
            cp "$(ls -t out/*.mp4 | head -1)" "$target"
          done
      - name: Keep the newest 3 date folders
        run: |
          for d in $(ls -d 20??-??-?? 2>/dev/null | sort | head -n -3); do git rm -rq "$d"; done
          for d in $(ls -d specs/20??-??-?? 2>/dev/null | sort | head -n -3); do git rm -rq "$d"; done
          true
      - name: Commit
        run: |
          git config user.name "whyitmoved-render"; git config user.email "render@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Render videos"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
